[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-poem-llm-benchmark"
version = "0.1.0"
description = "Benchmark and fine-tune Qwen/Gemma models for Chinese poem understanding on Apple Silicon."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
    "numpy>=1.24,<2.4",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "openpyxl>=3.1",
    "mlx>=0.20.0; platform_system == 'Darwin'",
    "mlx-lm>=0.20.0; platform_system == 'Darwin'",
]

[project.optional-dependencies]
bert = ["bert-score>=0.3.13", "torch", "transformers"]
dev = ["pytest", "ruff"]

[project.scripts]
poem-bench = "poem_llm_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
